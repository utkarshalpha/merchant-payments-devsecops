apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: merchant-payments-staging
  namespace: argocd
spec:
  project: merchant-payments
  source:
    repoURL: https://github.com/utkarshalpha/merchant-payments-devsecops.git
    targetRevision: main
    path: deploy/chart
    helm:
      releaseName: merchant-payments
      valueFiles: [environments/staging.json]
  destination:
    server: https://kubernetes.default.svc
    namespace: merchant-payments-staging
  syncPolicy:
    automated: {prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [PruneLast=true]
